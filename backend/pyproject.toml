[project]
name = "world-model-kit"
version = "0.2.0"
description = "世界模型工具包 v0.2.0 —— 基于 RECS SoA ECS 的高性能 Agent-Based Modeling 工具包，geometry 驱动的嵌套 Entity 树 + tags 语义标注"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.24",
    "recs>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
torch = ["torch>=2.0"]
mlx = ["mlx>=0.10"]
jax = ["jax>=0.4", "jaxlib>=0.4"]
all = ["world-model-kit[torch,mlx,jax]"]

[tool.setuptools.packages.find]
where = ["."]
