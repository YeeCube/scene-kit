[project]
name = "world-model-kit"
version = "0.2.0"
description = "世界模型工具包 v0.2.0 —— 基于 RECS SoA ECS 的高性能 Agent-Based Modeling 工具包，geometry 驱动的嵌套 Entity 树 + tags 语义标注"
requires-python = ">=3.13"
authors = [
    {name = "world-model-kit-team", email = "team@world-model-kit.dev"}
]
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Simulation",
]
dependencies = [
    "numpy>=2.0.0",
    "relation-entity-component-system-kit>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
]
visualization = [
    "matplotlib>=3.8.0",
]
torch = ["torch>=2.4.0"]
mlx = ["mlx>=0.22.0"]
jax = ["jax>=0.4.30", "jaxlib>=0.4.30"]
all = ["world-model-kit[dev,visualization,torch,mlx,jax]"]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
