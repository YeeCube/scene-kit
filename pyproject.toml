[project]
name = "scene-kit"
version = "0.5.1"
description = "SceneKit · 场景工具包 v0.5.1 —— 基于 RECS SoA 的 Entity 场景建模、列式协议与交互式前端 SDK（开源）。Scene Suite 伞形品牌下的 SDK 层。"
requires-python = ">=3.13"
authors = [
    {name = "scene-kit-team", email = "team@scene-kit.dev"}
]
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Simulation",
]
dependencies = [
    "numpy>=2.0.0",
    "relation-entity-component-system-kit>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.14.0",
    "pandas>=2.2.0",
    "ruff>=0.8.0",
]
data = ["pandas>=2.2.0"]
visualization = [
    "matplotlib>=3.8.0",
]
protocol = ["msgpack>=1.1.0"]
server = ["websockets>=15.0"]
torch = ["torch>=2.4.0"]
mlx = ["mlx>=0.22.0"]
jax = ["jax>=0.4.30", "jaxlib>=0.4.30"]
all = ["scene-kit[data,dev,visualization,protocol,server,torch,mlx,jax]"]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.14.0",
    "pandas>=2.2.0",
    "ruff>=0.8.0",
]

[tool.uv.sources]
relation-entity-component-system-kit = { path = "../relation-entity-component-system" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
